<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공주대 베리어프리 샘플 지도</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>베리어프리 캠퍼스 샘플</h1>
        <p class="hint">
          건물 마커를 눌러 상세정보 · 길찾기는 출발/도착 모드를 선택한 뒤 지도를 클릭하세요.
        </p>
      </header>
      <div class="toolbar">
        <div class="tool-group">
          <label>길찾기</label>
          <button type="button" id="btn-mode-none" class="active">끄기</button>
          <button type="button" id="btn-mode-from">출발 찍기</button>
          <button type="button" id="btn-mode-to">도착 찍기</button>
          <button type="button" id="btn-route-clear">경로 지우기</button>
        </div>
        <div class="tool-group">
          <label>지도 유형</label>
          <div class="buttons map-type-buttons">
            <input type="button" id="NORMAL" value="일반" class="control-on" />
            <input type="button" id="TERRAIN" value="지형" />
            <input type="button" id="SATELLITE" value="위성" />
            <input type="button" id="HYBRID" value="하이브리드" />
          </div>
        </div>
        <div class="tool-group">
          <label>레이어</label>
          <label><input type="checkbox" id="chk-network" /> 보행 네트워크</label>
          <label><input type="checkbox" id="chk-entrances" /> 출입구</label>
          <label><input type="checkbox" id="chk-ev" /> 엘리베이터</label>
          <label class="nowrap"
            ><input type="checkbox" id="chk-wheelchair" /> 계단·고페널티 구간 제외</label
          >
        </div>
        <div class="tool-group driving-tools">
          <label>차량 (네이버 길찾기 API)</label>
          <label class="nowrap"
            ><input type="checkbox" id="chk-driving" disabled /> 도로 경로 표시</label
          >
          <select id="sel-driving-option" disabled aria-label="차량 탐색 옵션">
            <option value="traoptimal">실시간 최적</option>
            <option value="trafast">빠른길</option>
            <option value="tracomfort">편한길</option>
            <option value="traavoidtoll">무료 우선</option>
            <option value="traavoidcaronly">자동차전용도로 회피</option>
          </select>
        </div>
        <div class="tool-group">
          <button type="button" id="btn-voice" disabled>길안내</button>
        </div>
      </div>
      <div id="map"></div>
      <div id="nav-panel" class="nav-panel hidden" aria-live="polite">
        <div class="nav-panel-inner">
          <div class="nav-panel-head">
            <span class="nav-panel-badge">길안내</span>
            <button type="button" id="btn-nav-stop" class="nav-stop-btn">종료</button>
          </div>
          <p class="nav-next-label">다음 안내</p>
          <p id="nav-next-text" class="nav-next-text">—</p>
          <p class="nav-meta">
            목적지까지 약 <strong id="nav-remain">—</strong>
          </p>
        </div>
      </div>
      <aside id="side-panel" class="side-panel hidden" aria-live="polite">
        <button type="button" id="panel-close" class="panel-close" aria-label="닫기">×</button>
        <div id="panel-body"></div>
      </aside>
      <div id="driving-status" class="driving-status hidden" role="status"></div>
      <div id="route-summary" class="route-summary hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
